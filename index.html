<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#17426b">
  <meta name="description" content="맨하탄선교교회 6주 새신자 제자양육 · Manhattan Mission Church New Believer Discipleship">
  <title>새로운 삶의 시작 · The Beginning of a New Life</title>
  <link rel="icon" type="image/png" href="assets/mmc-gray-logo.png">
  <link rel="stylesheet" href="https://cdn.youversion.com/platform/1/bible.css">
  <link rel="stylesheet" href="styles.css?v=20260930-11">
</head>
<body>
  <a class="skip-link" href="#lesson-content">본문으로 바로가기</a>
  <header class="site-header">
    <div class="brand">
      <img class="brand-logo" src="assets/mmc-gray-logo.png" alt="맨하탄선교교회 · Manhattan Mission Church">
      <div>
        <p class="eyebrow" id="course-subtitle"></p>
        <h1 id="course-title"></h1>
      </div>
    </div>
    <div class="header-actions">
      <div class="language-switch" role="group" aria-label="언어 선택 · Choose language">
        <button type="button" data-lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <button type="button" class="quiet-button" id="print-button">인쇄</button>
    </div>
  </header>

  <div class="progress-wrap" aria-live="polite">
    <div class="progress-copy"><span id="progress-label"></span><strong id="progress-count"></strong></div>
    <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
  </div>

  <div class="app-shell">
    <nav class="lesson-nav" aria-label="6주 과정" id="lesson-nav"></nav>
    <main id="lesson-content" tabindex="-1"></main>
    <aside class="tools" aria-label="학습 도구">
      <div class="tool-card">
        <p class="tool-title" id="save-title"></p>
        <p class="tool-copy" id="save-copy"></p>
        <label class="leader-mode-control">
          <input type="checkbox" id="leader-mode-toggle" role="switch">
          <span id="leader-mode-label"></span>
        </label>
        <label class="scripture-mode-control">
          <input type="checkbox" id="scripture-mode-toggle" role="switch">
          <span id="scripture-mode-label"></span>
        </label>
        <button type="button" id="export-button"></button>
        <button type="button" class="quiet-button" id="reset-button"></button>
      </div>
    </aside>
  </div>

  <footer class="site-footer">
    <p id="footer-copy"></p>
  </footer>

  <dialog class="bible-reader" id="bible-reader" aria-labelledby="bible-reader-title">
    <div class="bible-reader-shell">
      <header class="bible-reader-header">
        <div>
          <p class="bible-reader-kicker" id="bible-reader-kicker"></p>
          <h2 id="bible-reader-title"></h2>
        </div>
        <button type="button" class="bible-reader-close" id="bible-reader-close" aria-label="닫기">×</button>
      </header>
      <div class="bible-reader-status" id="bible-reader-status" role="status" aria-live="polite"></div>
      <article class="bible-reader-text" id="bible-reader-text" data-yv-sdk data-slot="yv-bible-renderer"></article>
      <p class="bible-reader-attribution" id="bible-reader-attribution"></p>
      <a class="bible-reader-link" id="bible-reader-link" href="https://www.bible.com/" target="_blank" rel="noopener"></a>
      <div class="bible-reader-alternates" id="bible-reader-alternates" hidden>
        <p id="bible-reader-alternates-title"></p>
        <div id="bible-reader-alternates-links"></div>
      </div>
    </div>
  </dialog>

  <script src="youversion-config.js?v=20260930-11"></script>
  <script src="course-data.js?v=20260930-9"></script>
  <script src="app.js?v=20260930-11"></script>
</body>
</html>
